[project]
name = "dronai-worker"
version = "0.1.0"
description = "Pipeline de reconstrucción 3D de DronAI: fotos o video → poses → Gaussian splats → escena para el visor."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dronai-worker = "dronai_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
